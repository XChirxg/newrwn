<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Case Study — newrwn</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../shared.js"></script>
</head>
<body class="tool-page">

    <div class="tool-viewport" id="mainViewport" style="display:none;">
        <div class="scenario-container glass" id="scenarioContainer">
            <p class="scenario-text" id="situationText">Loading scene...</p>
            <div class="scenario-choices" id="choicesWrap">
                <!-- Choice buttons loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Configuration Pre-start Page -->
    <div class="tool-viewport" id="prestartViewport" style="padding-top:80px;">
        <div class="glass" style="width:100%; max-width:480px; padding:30px; border-radius:var(--radius-lg); text-align:center;">
            <span style="font-size:44px;">💼</span>
            <h2 style="font-size:24px; margin: 12px 0 4px;" id="prestartTitle">Case Study Settings</h2>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:24px;" id="prestartSubtitle">Configure your branching narrative settings.</p>
            
            <div style="text-align:left; margin-bottom:30px; display:flex; flex-direction:column; gap:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <strong style="font-size:14px; color:var(--text-main);">TTS Auto-read on Load</strong>
                        <p style="font-size:12px; color:var(--text-muted);">Read situation text aloud when scene changes.</p>
                    </div>
                    <input type="checkbox" id="cfgAutoRead" checked style="width:20px; height:20px; cursor:pointer;">
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="startSession()" style="width:100%; padding:12px;">Start Case Study →</button>
            <p style="font-size:10.5px; color:var(--text-muted); margin-top:20px; border-top:1px solid var(--border-color); padding-top:10px;">
                Powered by <strong>newrwn</strong> — turning dry notes into interactive visual playgrounds.
            </p>
        </div>
    </div>

    <script>
        let scenes = [];
        let currentSceneId = 'start';
        let activeChoiceIndex = 0;
        
        let ttsAutoRead = true;

        window.addEventListener('DOMContentLoaded', () => {
            const data = Newrwn.init('case-study');
            document.getElementById('prestartSubtitle').textContent = data.topic;
            
            processCaseData(data.topic, data.content);
            document.addEventListener('keydown', handleKeyPress);
        });

        function loadToolData(topic, content, purpose) {
            processCaseData(topic, content);
            document.getElementById('prestartSubtitle').textContent = topic;
            
            document.getElementById('mainViewport').style.display = 'none';
            document.getElementById('prestartViewport').style.display = 'flex';
        }

        function processCaseData(topic, content) {
            const raw = Array.isArray(content) ? content : [content];
            if (raw[0] && raw[0].id && raw[0].text && raw[0].choices) {
                scenes = raw;
            } else {
                // sequential narrative fallback
                scenes = raw.map((item, idx) => {
                    const id = idx === 0 ? 'start' : `scene_${idx}`;
                    const nextId = idx === raw.length - 1 ? 'start' : `scene_${idx + 1}`;
                    const title = item.term || item.title || "milestone";
                    const text = item.definition || item.description || item.content || "Scenario detail info.";
                    
                    return {
                        id: id,
                        text: `[${title}] ${text}`,
                        choices: [
                            {
                                text: idx === raw.length - 1 ? "Restart Case Study" : "Advance to Next Stage",
                                next: nextId
                            }
                        ]
                    };
                });
            }
        }

        function startSession() {
            ttsAutoRead = document.getElementById('cfgAutoRead').checked;
            
            currentSceneId = 'start';
            activeChoiceIndex = 0;
            
            document.getElementById('prestartViewport').style.display = 'none';
            document.getElementById('mainViewport').style.display = 'flex';
            
            renderScene();
        }

        function renderScene() {
            if (scenes.length === 0) return;
            const scene = scenes.find(s => s.id === currentSceneId) || scenes[0];
            
            document.getElementById('situationText').innerHTML = scene.text;
            
            const wrap = document.getElementById('choicesWrap');
            wrap.innerHTML = '';

            scene.choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'scenario-choice-btn';
                if (idx === activeChoiceIndex) {
                    btn.style.borderColor = 'var(--accent)';
                    btn.style.background = 'rgba(139, 92, 246, 0.05)';
                }
                
                btn.onclick = () => selectChoice(c.next);
                btn.innerHTML = c.text;
                wrap.appendChild(btn);
            });

            if (ttsAutoRead) {
                speakCurrentItem();
            }
        }

        function selectChoice(nextId) {
            currentSceneId = nextId;
            activeChoiceIndex = 0;
            renderScene();
        }

        function navigateNextChoice() {
            const scene = scenes.find(s => s.id === currentSceneId) || scenes[0];
            if (!scene) return;
            activeChoiceIndex = (activeChoiceIndex + 1) % scene.choices.length;
            renderScene();
        }

        function triggerActiveChoice() {
            const scene = scenes.find(s => s.id === currentSceneId) || scenes[0];
            if (!scene || !scene.choices[activeChoiceIndex]) return;
            selectChoice(scene.choices[activeChoiceIndex].next);
        }

        // Host Remote controllers hook
        window.navigateNext = () => {
            triggerActiveChoice();
        };
        window.navigatePrev = () => {
            currentSceneId = 'start';
            activeChoiceIndex = 0;
            renderScene();
        };
        window.navigateFlip = () => {
            navigateNextChoice();
        };

        // TTS speaker hooks
        window.speakCurrentItem = () => {
            const scene = scenes.find(s => s.id === currentSceneId) || scenes[0];
            if (!scene) return;
            const choicesText = scene.choices.map((c, i) => `Choice ${i+1}: ${c.text}`).join('. ');
            Newrwn.speakText(`${scene.text}. Choices: ${choicesText}`);
        };

        function handleKeyPress(e) {
            const scene = scenes.find(s => s.id === currentSceneId) || scenes[0];
            if (!scene || document.getElementById('prestartViewport').style.display === 'flex') return;
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                navigateNextChoice();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                activeChoiceIndex = (activeChoiceIndex - 1 + scene.choices.length) % scene.choices.length;
                renderScene();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                triggerActiveChoice();
            }
        }
    </script>
</body>
</html>
